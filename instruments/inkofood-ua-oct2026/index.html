, "exclusive": false, "source": {"page": 11, "bbox": [90.0, 419.64, 98.82, 430.81]}, "code": "q44.a4"}, {"parts": ["Значительно снизит"], "line_index": 613, "text": "Значительно снизит", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 431.91, 98.82, 443.08]}, "code": "q44.a5"}, {"parts": ["Затрудняюсь ответить"], "line_index": 615, "text": "Затрудняюсь ответить", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 444.17, 98.82, 455.34]}, "code": "q44.a6"}], "source": {"page": 11, "bbox": [72.0, 326.05, 489.52, 337.22]}}, {"id": "q45", "number": 45, "block": "b11", "text": "Какой вес упаковки мясных деликатесов (например, ветчины, балыка и т. д.) наиболее удобен для Вашей повседневной покупки?", "type": "single", "instruction": "(Одиночный выбор)", "options": [{"parts": ["До 80 г"], "line_index": 621, "text": "До 80 г", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 551.5, 98.82, 562.67]}, "code": "q45.a1"}, {"parts": ["81–150 г"], "line_index": 623, "text": "81–150 г", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 563.76, 98.82, 574.94]}, "code": "q45.a2"}, {"parts": ["151–250 г"], "line_index": 625, "text": "151–250 г", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 576.03, 98.82, 587.2]}, "code": "q45.a3"}, {"parts": ["251–500 г"], "line_index": 627, "text": "251–500 г", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 588.3, 98.82, 599.47]}, "code": "q45.a4"}, {"parts": ["Более 500 г"], "line_index": 629, "text": "Более 500 г", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 600.56, 98.82, 611.73]}, "code": "q45.a5"}, {"parts": ["Затрудняюсь ответить"], "line_index": 631, "text": "Затрудняюсь ответить", "kind": "option", "exclusive": false, "source": {"page": 11, "bbox": [90.0, 612.83, 98.82, 624.0]}, "code": "q45.a6"}], "source": {"page": 11, "bbox": [72.0, 490.7, 525.72, 501.87]}}, {"id": "q46", "number": 46, "block": "b11", "text": "Представьте, что Вы можете добавить в ассортимент магазинов новый мясной продукт, которого сейчас не хватает. Что это был бы за продукт? (например, мясной рулет с необычной начинкой, набор разных видов мясной нарезки, мини-формат колбасы и т. д.)", "type": "open", "instruction": "(Открытый вопрос)", "options": [], "source": {"page": 11, "bbox": [72.0, 637.09, 534.98, 648.26]}}, {"id": "q47", "number": 47, "block": "b11", "text": "Как Вы относитесь к идее премиальной варёной колбасы — продукта более высокого качества и ценового уровня по сравнению с обычной вареной колбасой?", "type": "single", "instruction": "(Одиночный выбор)", "options": [{"parts": ["Такая колбаса вполне может быть премиальным продуктом, и мне был бы интересен этот", "продукт"], "line_index": 640, "text": "Такая колбаса вполне может быть премиальным продуктом, и мне был бы интересен этот продукт", "kind": "option", "exclusive": false, "source": {"page": 12, "bbox": [90.0, 133.12, 98.82, 144.3]}, "code": "q47.a1"}, {"parts": ["Варёная колбаса может быть премиальной, но только если она заметно отличается от", "обычной по качеству и внешнему виду"], "line_index": 643, "text": "Варёная колбаса может быть премиальной, но только если она заметно отличается от обычной по качеству и внешнему виду", "kind": "option", "exclusive": false, "source": {"page": 12, "bbox": [90.0, 157.66, 98.82, 168.83]}, "code": "q47.a2"}, {"parts": ["Варёная колбаса может быть премиальной, но лично мне такой продукт неинтересен"], "line_index": 646, "text": "Варёная колбаса может быть премиальной, но лично мне такой продукт неинтересен", "kind": "option", "exclusive": false, "source": {"page": 12, "bbox": [90.0, 182.19, 98.82, 193.36]}, "code": "q47.a3"}, {"parts": ["Мне сложно воспринимать варёную колбасу как премиальный продукт"], "line_index": 648, "text": "Мне сложно воспринимать варёную колбасу как премиальный продукт", "kind": "option", "exclusive": false, const TYPE={single:'Одиночный выбор',multi:'Множественный выбор',open:'Открытый вопрос',scale:'Шкала',matrix:'Матрица'};
let state={type:null};
document.getElementById('sub').textContent=`${D.totals.blocks} блоков, ${D.totals.questions} вопросов, ${D.totals.options} вариантов ответа, ${D.totals.scale_items} пунктов шкал. n=${D.instrument.n_total}.`;
const main=document.getElementById('main'), toc=document.getElementById('toc');
const types=[...new Set(D.questions.map(q=>q.type))];
const fl=document.getElementById('fl');
fl.innerHTML=types.map(t=>`<button data-t="${t}">${TYPE[t]||t} (${D.questions.filter(q=>q.type===t).length})</button>`).join('');
fl.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.type=state.type===b.dataset.t?null:b.dataset.t;fl.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.t===state.type));apply();});
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function opts(q){
  if(q.number===12){
    return Object.entries(q.show_if||{}).map(([sc,label])=>`<div class="instr">${esc(label)}</div><ol class="opts">`+
      q.options.filter(o=>o.scope===sc).map(o=>`<li><code class="c">${o.code}</code>${esc(o.text)}</li>`).join('')+`</ol>`).join('');
  }
  if(q.options&&q.options.length) return `<ol class="opts">`+q.options.map(o=>`<li><code class="c">${o.code}</code>${esc(o.text)}${o.scope?` <span class="tag scope">${o.scope}</span>`:''}</li>`).join('')+`</ol>`;
  if(q.items&&q.items.length) return `<ul class="items">`+q.items.map(i=>`<li><code class="c">${i.code}</code>${esc(i.text)}</li>`).join('')+`</ul>`;
  if(q.type==='matrix') return `<table><tr><th>Новинка / характеристика</th>${q.columns.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>`+
    q.rows.map(r=>`<tr><td>${esc(r)}</td><td></td><td></td></tr>`).join('')+`</table>`;
  return '';
}
D.blocks.forEach(b=>{
  const qs=D.questions.filter(q=>q.block===b.id);
  main.insertAdjacentHTML('beforeend',`<h2 class="q" id="${b.id}" style="margin:22px 0 8px;font-size:19px">Блок ${b.number}. ${esc(b.title)} <span class="tag">${qs.length} вопр.</span></h2>`);
  qs.forEach(q=>{

      ${q.instruction?`<div class="instr">${esc(q.instruction)}</div>`:''}
      ${q.routing?`<div class="instr">${esc(q.routing)}</div>`:''}
      ${q.number===13?`<div class="instr">${esc(q.raw_extra_text)}</div>`:''}
      ${opts(q)}
      ${q.notes?`<div class="note">${esc(q.notes)}</div>`:''}
      </section>`);
  });
});
toc.innerHTML='<h3>Блоки</h3>'+D.blocks.map(b=>`<a href="#${b.id}"><span class="num">${String(b.number).padStart(2,'0')}</span>${esc(b.title)}</a>`).join('');
function apply(){
  const s=document.getElementById('q').value.toLowerCase();
  document.querySelectorAll('section.card').forEach(c=>{
    const okType=!state.type||c.dataset.type===state.type;
    const okText=c.innerText.toLowerCase().indexOf(s)>=0;
    c.classList.toggle('hidden',!(okType&&okText));
  });
}
